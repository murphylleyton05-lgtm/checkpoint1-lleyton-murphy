<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kit comercial y plan de lanzamiento — Portada</title>
<link rel="stylesheet" href="../fuente/estilos.css">
<style>
  @page { size: A4; margin: 0; }
  html, body { margin: 0; padding: 0; }
  .portada { width: 210mm; height: 297mm; position: relative; overflow: hidden; background: linear-gradient(180deg, #f7f3ec 0%, #efe6d6 100%); font-family: var(--sans); color: var(--tinta); }
  .banda { position: absolute; left: 0; right: 0; top: 0; height: 118mm; background: linear-gradient(180deg, #0e3a4a, #0b2f3c); }
  .sello { position: absolute; top: 22mm; left: 22mm; font-size: 8.6pt; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: #9fd0ea; }
  h1 { position: absolute; top: 36mm; left: 22mm; right: 22mm; margin: 0; font-family: var(--display); font-weight: 800; font-size: 44pt; line-height: 1.0; letter-spacing: -.02em; color: #fbf6ee; }
  h1 em { font-style: italic; font-weight: 400; color: #f2b77a; }
  .sub { position: absolute; top: 88mm; left: 22mm; right: 22mm; font-family: var(--serif); font-size: 13pt; color: #dbe9ef; }
  .img { position: absolute; top: 128mm; left: 22mm; width: 166mm; border-radius: 4mm; overflow: hidden; box-shadow: 0 8mm 18mm rgba(14,58,74,.22); }
  .img img { width: 100%; display: block; }
  .pie { position: absolute; left: 22mm; right: 22mm; bottom: 18mm; display: flex; justify-content: space-between; font-size: 9pt; color: var(--tinta-2); }
  .pie b { color: var(--profundo); }
</style>
</head>
<body>
<div class="portada">
  <div class="banda"></div>
  <div class="sello">Documento de trabajo · Shopify</div>
  <h1>Kit comercial<br><em>y plan de lanzamiento.</em></h1>
  <p class="sub">Investigación de mercado, producto, precios, tienda, contenido, primeras ventas y proyecciones para «Ingresos variables, sueldo fijo».</p>
  <div class="img"><img src="../entregables/imagenes/02-mockup-principal.png" alt=""></div>
  <div class="pie"><span><b>Lleyton Murphy</b> · Octubre de 2026</span><span>Material interno</span></div>
</div>
</body>
</html>
