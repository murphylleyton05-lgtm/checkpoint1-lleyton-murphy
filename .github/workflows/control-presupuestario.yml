name: control-presupuestario

on:
  push:
    paths: ["control-presupuestario/**", ".github/workflows/control-presupuestario.yml"]
  pull_request:
    paths: ["control-presupuestario/**", ".github/workflows/control-presupuestario.yml"]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-presupuestario
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Los tests usan datos de prueba chicos: no descargan nada.
      - run: python -m pytest -q
