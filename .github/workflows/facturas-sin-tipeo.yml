name: facturas-sin-tipeo

on:
  push:
    paths: ["facturas-sin-tipeo/**", ".github/workflows/facturas-sin-tipeo.yml"]
  pull_request:
    paths: ["facturas-sin-tipeo/**", ".github/workflows/facturas-sin-tipeo.yml"]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: facturas-sin-tipeo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      # La demo tiene que correr de punta a punta sin API ni datos reales.
      - run: |
          facturas sinteticas --n 12 --sin-qr 2
          facturas inyectar --origen sintetica
