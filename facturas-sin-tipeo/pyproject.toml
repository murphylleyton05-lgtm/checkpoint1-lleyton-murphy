[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "facturas-sin-tipeo"
version = "0.1.0"
description = "Extracción y validación de facturas argentinas con IA, evaluada contra el QR fiscal de ARCA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "qrcode[pil]>=7.4",
]

[project.scripts]
facturas = "facturas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
